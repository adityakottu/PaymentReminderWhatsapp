name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, API, worker, webhook and acceptance tests (incl. 1,000 records)
        run: npm test
      - name: Load test (1,000 + 5,000 records)
        run: npm run test:load
